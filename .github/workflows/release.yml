name: Publish SDK release
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Match tag to compiler version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          version = re.search(r'^version = "([^"]+)"', open('Cargo.toml').read(), re.M)[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Native X11 window and pointer events
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfonts-base
          xvfb-run -a cargo test --locked --lib native_gui_surface -- --nocapture
      - run: cargo build --release --locked
      - name: Linux SDK, API and archive tests
        if: matrix.platform == 'linux'
        run: scripts/package-sdk.sh "$RUNNER_TEMP/release-assets"
      - name: Windows standard library contracts
        if: matrix.platform == 'windows'
        run: target/release/rewind.exe test --root libraries/std
      - name: Windows SDK, API and archive tests
        if: matrix.platform == 'windows'
        run: python scripts/package-sdk-windows.py "${{ runner.temp }}/release-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish both verified SDKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          VERSION_DOC="docs/REWIND_${RELEASE_TAG%.*}.md"
          if [[ -f "$VERSION_DOC" ]]; then
            cat "$VERSION_DOC" > "$NOTES"
            printf '\n' >> "$NOTES"
          else
            : > "$NOTES"
          fi
          cat docs/getting-started.md >> "$NOTES"
          printf '\n## Build and verification\n\nCommit: `%s`\n\n' "$GITHUB_SHA" >> "$NOTES"
          printf 'Linux and Windows regression tests, standard-library contracts, SDK signatures, 34 API baselines, extraction, input, record/replay and source-free execution passed.\n\n' >> "$NOTES"
          for KEY in release-assets/*-sdk.pub; do
            printf '%s (this release only): `%s`\n\n' "$(basename "$KEY")" "$(cat "$KEY")" >> "$NOTES"
          done
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "REWIND $RELEASE_TAG — Linux / Windows x86_64 SDK" --notes-file "$NOTES"
          if [[ "$RELEASE_TAG" == v1.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
