name: Publish SDK release
on:
  push:
    branches:
      - codex/develop
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/codex/develop' && startsWith(github.event.head_commit.message, 'Release v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Match release intent to compiler version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          version = re.search(r'^version = "([^"]+)"', open('Cargo.toml').read(), re.M)[1]
          tag = 'v' + version
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_REF'] == 'refs/tags/' + tag
          else:
              assert os.environ['RELEASE_REF'] == 'refs/heads/codex/develop'
              assert os.environ['RELEASE_MESSAGE'].splitlines()[0] == 'Release ' + tag
          PY
      - name: Check committed standard-library version metadata
        run: python scripts/check-standard-library-lock.py
      - run: cargo fmt --check
      - name: Linux PostgreSQL SCRAM and TLS fixture
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql openssl
          python3 scripts/postgres-fixture.py start --root "$RUNNER_TEMP/rewind-pg-fixture" --github-env "$GITHUB_ENV"
      - name: Windows PostgreSQL SCRAM and TLS fixture
        if: matrix.platform == 'windows'
        run: python scripts/postgres-fixture.py start --root "${{ runner.temp }}/rewind-pg-fixture" --github-env "${{ github.env }}"
      - run: cargo test --locked
      - name: Native X11 window and pointer events
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfonts-base libgtk-3-0 at-spi2-core dbus-x11 libxtst6 ibus-anthy python3-gi libglib2.0-bin
          xvfb-run -a cargo test --locked --lib native_gui_surface -- --nocapture
          xvfb-run -a cargo test --locked --test language_v1956 native_pointer_cancels -- --nocapture
          xvfb-run -a cargo test --locked --test language_v1958 native_pointer_cancels -- --nocapture
          xvfb-run -a cargo test --locked --test language_v1959 native_menu_commands -- --nocapture
          GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a cargo test --locked --lib native_file_dialog -- --nocapture
          GSETTINGS_BACKEND=memory dbus-run-session -- xvfb-run -a cargo test --locked --test language_v1960 native_dialog_responds -- --nocapture
          python3 scripts/ime-fixture.py -- cargo test --locked --lib native_ime_uses_real -- --nocapture
      - run: cargo build --release --locked
      - name: Linux SDK, API and archive tests
        if: matrix.platform == 'linux'
        run: dbus-run-session -- xvfb-run -a scripts/package-sdk.sh "$RUNNER_TEMP/release-assets"
      - name: Windows standard library contracts
        if: matrix.platform == 'windows'
        run: target/release/rewind.exe test --root libraries/std
      - name: Windows SDK, API and archive tests
        if: matrix.platform == 'windows'
        run: python scripts/package-sdk-windows.py "${{ runner.temp }}/release-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
      - name: Stop disposable PostgreSQL server
        if: always()
        shell: bash
        run: |
          python - <<'PY_STOP'
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rewind-pg-fixture'
          if (root / 'fixture.json').is_file():
              subprocess.run([sys.executable, 'scripts/postgres-fixture.py', 'stop', '--root', str(root)], check=True)
          PY_STOP
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Tag the frozen verified release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("Cargo.toml").read(), re.M)[1])')
          RELEASE_TAG="v$VERSION"
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "REWIND $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Integrate the verified version into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --unshallow origin || git fetch origin
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            exit 0
          fi
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/main"
      - name: Publish both verified SDKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          VERSION_DOC="docs/REWIND_${RELEASE_TAG}.md"
          if [[ ! -f "$VERSION_DOC" ]]; then
            VERSION_DOC="docs/REWIND_${RELEASE_TAG%.*}.md"
          fi
          if [[ -f "$VERSION_DOC" ]]; then
            cat "$VERSION_DOC" > "$NOTES"
            printf '\n' >> "$NOTES"
          else
            : > "$NOTES"
          fi
          cat docs/getting-started.md >> "$NOTES"
          printf '\n## Build and verification\n\nCommit: `%s`\n\n' "$GITHUB_SHA" >> "$NOTES"
          BASELINE_COUNT=$(python -c "import glob; print(len(glob.glob('libraries/api/*.api.json')))")
          printf 'Linux and Windows regression tests, standard-library contracts, SDK signatures, %s API baselines, extraction, input, record/replay and source-free execution passed.\n\n' "$BASELINE_COUNT" >> "$NOTES"
          for KEY in release-assets/*-sdk.pub; do
            printf '%s (this release only): `%s`\n\n' "$(basename "$KEY")" "$(tr -d '\r\n' < "$KEY")" >> "$NOTES"
          done
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "REWIND $RELEASE_TAG — Linux / Windows x86_64 SDK" --notes-file "$NOTES"
          if [[ "$RELEASE_TAG" == v1.* || "$RELEASE_TAG" == v2.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
