name: Publish SDK release
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to compiler version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          version = re.search(r'^version = "([^"]+)"', open('Cargo.toml').read(), re.M)[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package and smoke-test SDK and source archives
        run: scripts/package-sdk.sh "$RUNNER_TEMP/release-assets"
      - name: Publish verified development release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat docs/getting-started.md > "$NOTES"
          printf '\n## Build and verification\n\n' >> "$NOTES"
          printf 'Commit: `%s`\n\n' "$GITHUB_SHA" >> "$NOTES"
          printf 'Rust regression tests, standard-library contracts, SDK signatures, 33 API baselines, archive extraction, CLI input, record/replay and source-free execution passed.\n\n' >> "$NOTES"
          printf 'SDK public key (this release only): `%s`\n' "$(cat "$RUNNER_TEMP/release-assets/rewind-"*-sdk.pub)" >> "$NOTES"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* --verify-tag --draft --prerelease --title "REWIND $RELEASE_TAG — Linux x86_64 SDK" --notes-file "$NOTES"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
