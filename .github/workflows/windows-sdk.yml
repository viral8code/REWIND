name: Windows SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Check committed standard-library version metadata
        run: python scripts/check-standard-library-lock.py
      - run: cargo fmt --check
      - name: Disposable PostgreSQL SCRAM and TLS server
        run: python scripts/postgres-fixture.py start --root "${{ runner.temp }}/rewind-pg-fixture" --github-env "${{ github.env }}"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: target/release/rewind.exe test --root libraries/std
      - name: Verify extracted Windows SDK
        run: python scripts/package-sdk-windows.py "${{ runner.temp }}/windows-assets"
      - name: Stop disposable PostgreSQL server
        if: always()
        run: |
          if (Test-Path "${{ runner.temp }}/rewind-pg-fixture/fixture.json") {
            python scripts/postgres-fixture.py stop --root "${{ runner.temp }}/rewind-pg-fixture"
          }
