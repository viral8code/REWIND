name: Linux SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Check committed standard-library version metadata
        run: python scripts/check-standard-library-lock.py
      - run: cargo fmt --check
      - name: Disposable PostgreSQL SCRAM and TLS server
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql openssl
          python3 scripts/postgres-fixture.py start --root "$RUNNER_TEMP/rewind-pg-fixture" --github-env "$GITHUB_ENV"
      - run: cargo test --locked
      - name: Native X11 window and pointer events
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfonts-base libgtk-3-0 at-spi2-core dbus-x11 libxtst6 ibus-anthy python3-gi libglib2.0-bin
          xvfb-run -a cargo test --locked --lib native_gui_surface -- --nocapture
          xvfb-run -a cargo test --locked --test language_v1956 native_pointer_cancels -- --nocapture
          xvfb-run -a cargo test --locked --test language_v1958 native_pointer_cancels -- --nocapture
          xvfb-run -a cargo test --locked --test language_v1959 native_menu_commands -- --nocapture
          GSETTINGS_BACKEND=memory python3 scripts/gui-session-fixture.py -- xvfb-run -a cargo test --locked --lib native_file_dialog -- --nocapture
          GSETTINGS_BACKEND=memory python3 scripts/gui-session-fixture.py -- xvfb-run -a cargo test --locked --test language_v1960 native_dialog_responds -- --nocapture
          python3 scripts/ime-fixture.py -- cargo test --locked --lib native_ime_uses_real -- --nocapture
          REWIND_TEST_A11Y_SERVICE=1 python3 scripts/gui-session-fixture.py -- xvfb-run -a cargo test --locked --lib real_atspi -- --nocapture
          xvfb-run -a cargo test --locked --lib native_font_service -- --nocapture
          xvfb-run -a cargo test --locked --test language_v1962 native_pointer -- --nocapture
      - run: cargo build --release --locked
      - name: Standard library contracts and SDK API compatibility
        shell: bash
        run: |
          set -euo pipefail
          SDK_WORK=$(mktemp -d)
          trap 'rm -rf "$SDK_WORK"' EXIT
          target/release/rewind test --root libraries/std
          PUBLIC_KEY=$(target/release/rewind keygen "$SDK_WORK/key")
          target/release/rewind sdk-build --output "$SDK_WORK/sdk" --key "$SDK_WORK/key"
          target/release/rewind sdk-verify --sdk "$SDK_WORK/sdk" --public-key "$PUBLIC_KEY"
          for BASELINE in libraries/api/*.api.json; do
            target/release/rewind api-diff "$BASELINE" "$SDK_WORK/sdk/share/rewind/doc/std/$(basename "$BASELINE")" --deny-breaking
          done
          mkdir "$SDK_WORK/simple"
          cp "$SDK_WORK/sdk/share/rewind/examples/checkpoint/main.rw" "$SDK_WORK/simple/main.rw"
          "$SDK_WORK/sdk/bin/rewindc" "$SDK_WORK/simple/main.rw"
          rm "$SDK_WORK/simple/main.rw"
          "$SDK_WORK/sdk/bin/rewind" "$SDK_WORK/simple/main.rwc" > "$SDK_WORK/actual"
          printf '99\n10\n' > "$SDK_WORK/expected"
          cmp "$SDK_WORK/expected" "$SDK_WORK/actual"
      - name: Stop disposable PostgreSQL server
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/rewind-pg-fixture/fixture.json" ]]; then
            python3 scripts/postgres-fixture.py stop --root "$RUNNER_TEMP/rewind-pg-fixture"
          fi
