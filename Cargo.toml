[package]
name = "rewind"
default-run = "rewind"
version = "1.9.11"
edition = "2021"
license = "MIT"
description = "A transactional programming language with checkpoints and virtual I/O"

# Preserve REWIND source locations for Rust debugging without distributing all
# transport dependency debug data twice in debug-built test SDKs.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[dependencies]
ed25519-dalek = "=2.2.0"
sha2 = "=0.10.9"
serde_json = "=1.0.145"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
getrandom = "=0.2.17"
base64 = "=0.22.1"
bytes = "=1.12.1"
aho-corasick = "=1.1.4"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "hooks", "limits", "extra_check", "column_decltype"] }
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring", "native-certs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "nfa-pikevm", "unicode"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[lib]
name = "rewind"
path = "src/lib.rs"

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[[bin]]
name = "rewind"
path = "src/main.rs"

[[bin]]
name = "rewindc"
path = "src/rewindc.rs"
