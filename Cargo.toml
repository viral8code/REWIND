[package]
name = "rewind"
default-run = "rewind"
version = "1.6.1"
edition = "2021"
license = "MIT"
description = "A transactional programming language with checkpoints and virtual I/O"

# Preserve REWIND source locations for Rust debugging without distributing all
# transport dependency debug data twice in debug-built test SDKs.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[dependencies]
ed25519-dalek = "=2.2.0"
sha2 = "=0.10.9"
serde_json = "=1.0.145"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
getrandom = "=0.2.17"
base64 = "=0.22.1"
bytes = "=1.12.1"
aho-corasick = "=1.1.4"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[lib]
name = "rewind"
path = "src/lib.rs"

[dev-dependencies]
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[[bin]]
name = "rewind"
path = "src/main.rs"

[[bin]]
name = "rewindc"
path = "src/rewindc.rs"
